<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner di Viaggi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: testata e ricerca, poi mappa con calendario e programma a destra, elenco luoghi, assistente di viaggio */
:root{
  --bg:#eef1f8; --panel:#ffffff; --ink:#0e1630; --muted:#5a6684; --line:#e0e5f1; --soft:#f1f4fb;
  --accent:#2a5bff; --accent-ink:#ffffff; --accent-soft:#e4ebff; --pin:#ff5a3c; --ok:#14935f; --warn:#d97706; --bad:#d93a3a;
  --sea:#cfe2f4; --land:#f7f5ee; --coast:#9fb4c9; --border:#c8bfae; --mlabel:#5b6a82; --halo:rgba(255,255,255,.88);
  --glow:radial-gradient(900px 400px at 85% -10%,rgba(42,91,255,.10),transparent 60%),radial-gradient(700px 360px at -5% 10%,rgba(255,90,60,.07),transparent 60%);
  --shadow:0 1px 2px rgba(14,22,48,.05),0 10px 30px rgba(14,22,48,.07);
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
body[data-eff="dark"]{
  --bg:#090e1c; --panel:#121a30; --ink:#e8ecf9; --muted:#95a1c2; --line:#222c47; --soft:#18223c;
  --accent:#6f90ff; --accent-ink:#071030; --accent-soft:#1b2a55; --pin:#ff7a5c; --ok:#3ccf92; --warn:#f0a43a; --bad:#ff6b6b;
  --sea:#0b1830; --land:#18253f; --coast:#34527e; --border:#3a4d70; --mlabel:#9fb0d0; --halo:rgba(9,14,28,.85);
  --glow:radial-gradient(900px 400px at 85% -10%,rgba(111,144,255,.16),transparent 60%),radial-gradient(700px 360px at -5% 10%,rgba(255,122,92,.08),transparent 60%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{background:transparent}
html,body{margin:0;color:var(--ink);font:14.5px/1.5 var(--body)}
body{background:var(--glow),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 48px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;transition:background .15s,transform .15s}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.ghost{background:transparent}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);text-decoration:none}
.ibtn:hover{background:var(--soft);color:var(--ink)}
.ibtn.on{color:var(--accent);background:var(--accent-soft)}
.ibtn.fav.on{color:#e0a100}.ibtn.fav.on svg{fill:#e0a100}
.ibtn.done.on{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo svg.i{width:22px;height:22px}
h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tripbar{padding:14px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.triprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.triprow select{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:700;min-width:190px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;align-items:center}
.stat{display:flex;flex-direction:column;padding:2px 14px;border-left:1px solid var(--line)}
.stat b{font:700 20px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tstatus{font-weight:700;color:var(--accent);text-align:right;padding-left:14px;border-left:1px solid var(--line)}
.tstatus small{display:block;color:var(--muted);font-weight:500}
.searchbox{position:relative}
.sfield{display:flex;align-items:center;gap:12px;padding:0 18px;height:54px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);box-shadow:var(--shadow);color:var(--muted)}
.sfield:focus-within{border-color:var(--accent);color:var(--accent)}
.sfield input{flex:1;border:0;background:transparent;outline:0;height:100%;font-size:16px;min-width:0;color:var(--ink)}
.kbd{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.drop{position:absolute;left:0;right:0;top:60px;z-index:30;max-height:460px;overflow:auto;padding:8px}
.drop h4{margin:10px 12px 4px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ritem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:8px 12px}
.ritem:hover,.ritem.act{background:var(--soft)}
.ritem .t{flex:1;min-width:0}
.ritem .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .t span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .go{color:var(--accent);font-size:13px;font-weight:700;white-space:nowrap}
.empty{padding:10px 12px;color:var(--muted);font-size:14px}
.mainrow{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
.mapcard{position:relative;overflow:hidden;height:min(78vh,700px);min-height:420px;background:var(--sea)}
.mapcard canvas,.mapcard svg.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapcard svg.map{touch-action:none;cursor:grab;user-select:none}
.mapcard svg.map.drag{cursor:grabbing}
.mctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px}
.mctl .btn{padding:0;width:40px;height:40px;justify-content:center;box-shadow:var(--shadow)}
.mhint{position:absolute;left:14px;top:14px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);padding:6px 13px;border-radius:999px;backdrop-filter:blur(6px)}
.mnote{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 11px;border-radius:999px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(6px)}
.scale{display:inline-block;height:6px;border:1.5px solid var(--ink);border-top:0;opacity:.8}
.pin{cursor:pointer}
.pin text{font:700 11px var(--body);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.plabel{font:700 12px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.cal{padding:16px}
.calhead{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.calhead b{flex:1;text-align:center;font:700 16px var(--display);text-transform:capitalize}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{font-size:11.5px;text-align:center;color:var(--muted);padding:4px 0;font-weight:700}
.day{position:relative;aspect-ratio:1/0.92;border:0;background:transparent;border-radius:10px;font-variant-numeric:tabular-nums;display:grid;place-items:center;font-size:14px;font-weight:600;padding:0}
.day:hover{background:var(--soft)}
.day.out{color:var(--muted);opacity:.45;font-weight:500}
.day.inr{background:color-mix(in srgb,var(--tc,var(--accent)) 20%,transparent);border-radius:0}
.day.rs{border-radius:999px 0 0 999px}.day.re{border-radius:0 999px 999px 0}.day.rs.re{border-radius:999px}
.day.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.day.sel{background:var(--accent);color:var(--accent-ink);border-radius:10px}
.day .dots{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--pin)}
.day.sel .dots i{background:var(--accent-ink)}
.calfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.prog{padding:16px}
.prog h3,.ph{margin:0 0 10px;font:700 15px var(--display);display:flex;align-items:center;gap:8px}
.ph .sp{margin-left:auto}
.days{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;padding-right:2px}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:transparent;border-radius:14px;padding:7px 10px;text-align:left;width:100%}
.drow:hover{background:var(--soft)}
.drow.on{border-color:var(--accent);background:var(--accent-soft)}
.drow .dn{text-align:center;line-height:1.1}
.drow .dn b{display:block;font:700 18px var(--display)}
.drow .dn span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.drow .dt{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dt i{color:var(--muted);font-style:normal}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.list{padding:0}
.lhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.lhead h2{margin:0;font:700 20px var(--display);margin-right:auto}
.lhead select{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--soft);border-radius:999px;padding:2px 10px 2px 8px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.dayx{background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;padding:4px 12px}
.rows{display:flex;flex-direction:column;padding:6px 8px 10px}
.row{display:grid;grid-template-columns:26px 34px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 10px 10px 4px;border-radius:14px;position:relative;border:1px solid transparent}
.row:hover{background:var(--soft)}
.row.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.row.dragging{opacity:.4}
.row.ot::before,.row.ob::after{content:"";position:absolute;left:0;right:0;height:3px;border-radius:3px;background:var(--accent)}
.row.ot::before{top:-2px}.row.ob::after{bottom:-2px}
.leg{margin:0 0 0 48px;padding:1px 0 1px 14px;border-left:2px dashed var(--line);font-size:12px;color:var(--muted);height:22px;display:flex;align-items:center}
.grip{cursor:grab;color:var(--muted);display:grid;place-items:center;height:32px}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--c);font-variant-numeric:tabular-nums}
.row.isdone .num{background:var(--ok)}
.row.isdone .nm{text-decoration:line-through;color:var(--muted)}
.nm{font-weight:700;background:none;border:0;padding:0;text-align:left;font-size:15px}
.nm:hover{text-decoration:underline}
.sub{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.sub input[type=date]{border:1px solid var(--line);background:transparent;border-radius:8px;padding:1px 6px;font-size:12.5px}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end}
.notebox{grid-column:3/-1}
.notebox textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px}
.notetxt{grid-column:3/-1;font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.none{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.none b{display:block;color:var(--ink);font:700 18px var(--display)}
.assist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.assist .card{padding:18px;display:flex;flex-direction:column;gap:12px}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--soft)}
.ins .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn)}
.ins.info .dot{background:var(--accent)}.ins.ok .dot{background:var(--ok)}.ins.bad .dot{background:var(--bad)}
.ins p{margin:0;flex:1}
.ins .btn{align-self:center}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sres{display:flex;flex-direction:column;gap:8px}
.sitem{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.sitem .cd{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sitem b{display:block}.sitem span{font-size:13px;color:var(--muted)}
.sitem .ac{display:flex;gap:4px}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.brow{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.big{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.pk{display:flex;align-items:center;gap:10px;padding:4px 2px}
.pk input{width:18px;height:18px;accent-color:var(--accent)}
.pk.d span{text-decoration:line-through;color:var(--muted)}
.pk span{flex:1}
.hint{color:var(--muted);font-size:13px}
.veil{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;z-index:60;padding:16px;backdrop-filter:blur(3px)}
.modal{width:min(480px,100%);padding:22px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.modal h3{margin:0;font:700 22px var(--display)}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.modal input,.modal select,.modal textarea{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.swatches{display:flex;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px var(--panel)}
.swatches button.on{border-color:var(--ink)}
.coords{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:var(--shadow)}
.toast button{border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:800;padding:0}
.spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.btn{transition:none}}
@media (max-width:1000px){.mainrow{grid-template-columns:1fr}.mapcard{height:62vh}.assist{grid-template-columns:1fr}.chips{margin-left:0}}
@media (max-width:700px){.row{grid-template-columns:24px 30px minmax(0,1fr)}.acts{grid-column:1/-1;justify-content:flex-start}.notebox,.notetxt{grid-column:1/-1}.leg{margin-left:40px}h1{font-size:21px}}
</style>

<body>
<div class="wrap">
  <header class="head">
    <div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24" data-i="plane"></svg></span><h1>Planner di Viaggi</h1></div>
    <div class="seg" id="themeSeg" role="group" aria-label="Tema">
      <button type="button" data-th="light" title="Tema chiaro"><svg class="i" viewBox="0 0 24 24" data-i="sun"></svg>Chiaro</button>
      <button type="button" data-th="dark" title="Tema scuro"><svg class="i" viewBox="0 0 24 24" data-i="moon"></svg>Scuro</button>
      <button type="button" data-th="auto" title="Segui il sistema"><svg class="i" viewBox="0 0 24 24" data-i="auto"></svg>Auto</button>
    </div>
  </header>

  <div class="card tripbar">
    <div class="triprow">
      <select id="tripSel" aria-label="Viaggio attivo"></select>
      <button class="btn sm" id="tripEdit" type="button"><svg class="i" viewBox="0 0 24 24" data-i="edit"></svg>Modifica</button>
      <button class="btn primary sm" id="tripNew" type="button"><svg class="i" viewBox="0 0 24 24" data-i="plus"></svg>Nuovo viaggio</button>
    </div>
    <div class="chips" id="tripMeta"></div>
  </div>

  <div class="searchbox" id="sbox">
    <label class="sfield"><svg class="i" viewBox="0 0 24 24" data-i="search"></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Cerca città, monumenti, ristoranti, spiagge, qualsiasi cosa" aria-label="Cerca">
      <span class="kbd">/</span></label>
    <div class="card drop" id="drop" hidden></div>
  </div>

  <section class="mainrow">
    <div class="card mapcard" id="mapcard" aria-label="Mappa">
      <canvas id="cv"></canvas>
      <svg class="map" id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mappa dei luoghi"></svg>
      <div id="lmap" hidden></div>
      <div class="mhint">Clicca sulla mappa per aggiungere un punto</div>
      <div class="mctl">
        <button class="btn" id="zIn" type="button" aria-label="Ingrandisci"><svg class="i" viewBox="0 0 24 24" data-i="plus"></svg></button>
        <button class="btn" id="zOut" type="button" aria-label="Riduci"><svg class="i" viewBox="0 0 24 24" data-i="minus"></svg></button>
        <button class="btn" id="zFit" type="button" aria-label="Mostra tutti i luoghi" title="Mostra tutti i luoghi"><svg class="i" viewBox="0 0 24 24" data-i="fit"></svg></button>
        <button class="btn" id="zStreet" type="button" aria-label="Strade e POI" title="Strade e punti di interesse"><svg class="i" viewBox="0 0 24 24" data-i="route"></svg></button>
        <button class="btn" id="zLoc" type="button" aria-label="La mia posizione" title="La mia posizione in tempo reale"><svg class="i" viewBox="0 0 24 24" data-i="target"></svg></button>
        <button class="btn" id="zRoute" type="button" aria-label="Mostra percorso" title="Mostra il percorso nell'ordine dell'elenco"><svg class="i" viewBox="0 0 24 24" data-i="route"></svg></button>
      </div>
      <div class="mnote"><span id="mscale"></span><span id="mload">Carico la mappa…</span></div>
    </div>
    <aside class="side">
      <div class="card cal" aria-label="Calendario">
        <div class="calhead">
          <button class="ibtn" id="cPrev" type="button" aria-label="Mese precedente"><svg class="i" viewBox="0 0 24 24" data-i="l"></svg></button>
          <b id="cTitle"></b>
          <button class="ibtn" id="cNext" type="button" aria-label="Mese successivo"><svg class="i" viewBox="0 0 24 24" data-i="r"></svg></button>
        </div>
        <div class="grid7" id="cGrid"></div>
        <div class="calfoot"><span id="cInfo"></span><button class="btn sm" id="cToday" type="button">Oggi</button></div>
      </div>
      <div class="card prog" id="prog"></div>
    </aside>
  </section>

  <section class="card list">
    <div class="lhead">
      <h2 id="lTitle">Luoghi da visitare</h2>
      <span id="lDay"></span>
      <div class="seg" id="lSeg" role="group" aria-label="Filtro stato">

    for(let i=0;i<n;i++){const x=MX(f[2*i]),y=MY(f[2*i+1]);p[2*i]=x;p[2*i+1]=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    return{p,b:[x0,y0,x1,y1]}});

const box=()=>{const r=mapEl.getBoundingClientRect();return{w:Math.max(r.width,10),h:Math.max(r.height,10)}};
function clampView(){view.w=Math.min(Math.max(view.w,0.01),720);view.cx=Math.min(Math.max(view.cx,0),360);view.cy=Math.min(Math.max(view.cy,0),360)}
function applyView(){
  clampView();const b=box();const h=view.w*b.h/b.w;
  mapEl.setAttribute("viewBox",(view.cx-view.w/2)+" "+(view.cy-h/2)+" "+view.w+" "+h);
  renderPins();scheduleDraw();
}
const unit=()=>view.w/box().w;
function screenToMap(ev){const r=mapEl.getBoundingClientRect();const u=unit();const h=view.w*r.height/r.width;return{x:view.cx-view.w/2+(ev.clientX-r.left)*u,y:view.cy-h/2+(ev.clientY-r.top)*u}}
function flyTo(cx,cy,w,instant){
  cancelAnimationFrame(anim);
  if(instant||matchMedia("(prefers-reduced-motion:reduce)").matches){view={cx,cy,w};applyView();return}
  const s={...view},t0=performance.now(),D=600;
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);
    view={cx:s.cx+(cx-s.cx)*e,cy:s.cy+(cy-s.cy)*e,w:Math.exp(Math.log(s.w)+(Math.log(w)-Math.log(s.w))*e)};applyView();if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function flyPlace(p,w){const[x,y]=P(p.lat,p.lon);flyTo(x,y,w||Math.min(view.w,0.6))}
function fit(instant){
  const pts=trip().places.map(p=>P(p.lat,p.lon));if(ghost)pts.push(P(ghost.lat,ghost.lon));
  const b=box();
  if(!pts.length){flyTo(MX(12),MY(42),Math.max(60,60*b.w/b.h*0.7),instant);return}
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const w=Math.max((x1-x0)*1.4,(y1-y0)*1.4*b.w/b.h,pts.length>1?0.15:0.3);
  flyTo((x0+x1)/2,(y0+y1)/2,w,instant);
}
function zoomBy(f,mx,my){
  const w=Math.min(Math.max(view.w*f,0.01),720);
  if(mx==null){flyTo(view.cx,view.cy,w);return}
  const k=w/view.w;view.cx=mx-(mx-view.cx)*k;view.cy=my-(my-view.cy)*k;view.w=w;applyView();
}

function scheduleDraw(){if(drawQ)return;drawQ=requestAnimationFrame(()=>{drawQ=0;drawBase()})}
function trace(p,ms,close){ctx.moveTo(p[0],p[1]);let lx=p[0],ly=p[1];const n=p.length;for(let i=2;i<n;i+=2){const x=p[i],y=p[i+1];if(Math.abs(x-lx)<ms&&Math.abs(y-ly)<ms&&i<n-2)continue;ctx.lineTo(x,y);lx=x;ly=y}if(close)ctx.closePath()}

function drawBase(){
  const b=box(),dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=Math.round(b.w*dpr),ch=Math.round(b.h*dpr);
  if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch}
  if(!MC.sea)refreshColors();
  const u=view.w/b.w,k=1/u,h=b.h*u,x0=view.cx-view.w/2,y0=view.cy-h/2,x1=x0+view.w,y1=y0+h;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=MC.sea;ctx.fillRect(0,0,cv.width,cv.height);
  const ds=(view.w<70&&W10)?W10:W50;
  if(ds){
    ctx.setTransform(dpr*k,0,0,dpr*k,-x0*k*dpr,-y0*k*dpr);
    const ms=u*0.7;
    ctx.beginPath();for(const r of ds.rings)if(inb(r.b,x0,y0,x1,y1))trace(r.p,ms,true);
    ctx.fillStyle=MC.land;ctx.fill("evenodd");ctx.lineWidth=u*1.1;ctx.lineJoin="round";ctx.strokeStyle=MC.coast;ctx.stroke();
    if(view.w<260){ctx.beginPath();for(const r of ds.lines)if(inb(r.b,x0,y0,x1,y1))trace(r.p,ms,false);
      ctx.setLineDash([u*4,u*3]);ctx.lineWidth=u*0.9;ctx.strokeStyle=MC.border;ctx.stroke();ctx.setLineDash([])}
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textBaseline="middle";ctx.lineJoin="round";
  const halo=(t,x,y)=>{ctx.strokeStyle=MC.halo;ctx.lineWidth=4;ctx.strokeText(t,x,y);ctx.fillText(t,x,y)};
  /* nomi dei paesi */
  if(W50&&view.w>7){
    ctx.textAlign="center";ctx.fillStyle=MC.mlabel;
    try{ctx.letterSpacing="2px"}catch(e){}
    for(const c of W50.labels){const sz=Math.sqrt(c.a)*k;if(sz<70)continue;const sx=(c.x-x0)*k,sy=(c.y-y0)*k;if(sx<0||sy<0||sx>b.w||sy>b.h)continue;
      ctx.font="700 "+Math.round(Math.min(15,10+sz/90))+"px Manrope,system-ui,sans-serif";ctx.globalAlpha=.75;halo(c.n.toUpperCase(),sx,sy);ctx.globalAlpha=1}
    try{ctx.letterSpacing="0px"}catch(e){}
  }
  /* città */
  if(BIG.length){
    const minPop=view.w>180?3e6:view.w>90?1e6:view.w>45?4e5:view.w>20?1.5e5:view.w>8?6e4:view.w>2.5?2.5e4:0;
    const occ=[];let n=0;ctx.textAlign="left";
    for(let i=0;i<BIG.length&&n<110;i++){const c=BIG[i];if(c.pop<minPop)break;
      if(c.x<x0||c.x>x1||c.y<y0||c.y>y1)continue;
      const sx=(c.x-x0)*k,sy=(c.y-y0)*k,big=c.pop>1e6;
      ctx.font=(big?"700 13px":"600 12px")+" Manrope,system-ui,sans-serif";
      const tw=ctx.measureText(c.name).width,rx=sx+7,ry=sy-8;
      let hit=false;for(const o of occ){if(rx<o[2]&&rx+tw>o[0]&&ry<o[3]&&ry+16>o[1]){hit=true;break}}
      ctx.fillStyle=MC.ink;ctx.beginPath();ctx.arc(sx,sy,big?3.2:2.4,0,6.3);ctx.fill();
      if(hit)continue;occ.push([rx,ry,rx+tw,ry+16]);n++;
      ctx.fillStyle=MC.ink;halo(c.name,rx,sy)}
  }
  /* scala */
  const kmPerPx=u*111.32*Math.cos(INV(view.cx,view.cy).lat*D2R);
  const nice=[0.05,0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000];let bar=nice[0];
  for(const v of nice){if(v/kmPerPx<=130)bar=v}
  const el=$("#mscale");el.innerHTML='<span class="scale" style="width:'+Math.round(bar/kmPerPx)+'px"></span> '+(bar<1?bar*1000+" m":bar+" km");
}

function tripDays(t){if(!t.start)return[];const e=t.end&&t.end>=t.start?t.end:t.start;const n=Math.min(dnum(e)-dnum(t.start)+1,90);const a=[];for(let i=0;i<n;i++)a.push(addDays(t.start,i));return a}
function tripStatus(t){
  if(!t.start)return["Date da definire","Imposta le date con «Modifica»"];
  const td=dnum(todayIso()),s=dnum(t.start),e=t.end?dnum(t.end):s;
  if(td<s){const n=s-td;return[n===1?"Parte domani":"Parte tra "+n+" giorni",fmtDate(t.start)+(t.end?" – "+fmtDate(t.end):"")]}
  if(td<=e)return["Giorno "+(td-s+1)+" di "+(e-s+1),"In corso"];
  return["Concluso",fmtDate(t.start)+(t.end?" – "+fmtDate(t.end):"")];
}

  const t=trip(),first=new Date(cal.y,cal.m,1),lead=(first.getDay()+6)%7,dim=new Date(cal.y,cal.m+1,0).getDate(),prevDim=new Date(cal.y,cal.m,0).getDate();

  let h=["L","M","M","G","V","S","D"].map(d=>'<div class="dow">'+d+'</div>').join("");
  const total=Math.ceil((lead+dim)/7)*7,td=todayIso();
  for(let i=0;i<total;i++){
    let y=cal.y,m=cal.m,d=i-lead+1,out=false;
    if(d<1){m--;d=prevDim+d;out=true;if(m<0){m=11;y--}}else if(d>dim){d-=dim;m++;out=true;if(m>11){m=0;y++}}
    const iso=isoOf(y,m,d),inr=t.start&&iso>=t.start&&iso<=(t.end||t.start),n=byDay[iso]||0;
    const cls=["day"];if(out)cls.push("out");if(inr)cls.push("inr");if(inr&&iso===t.start)cls.push("rs");if(inr&&iso===(t.end||t.start))cls.push("re");

/* ================= funzioni intelligenti: percorso e giorni ================= */
function orderPath(arr){
  const n=arr.length;if(n<3)return arr.slice();
  const D=arr.map(a=>arr.map(b=>dist(a,b)));
  const used=Array(n).fill(false),path=[0];used[0]=true;
  for(let k=1;k<n;k++){const last=path[path.length-1];let bj=-1,bd=1e18;for(let j=0;j<n;j++)if(!used[j]&&D[last][j]<bd){bd=D[last][j];bj=j}used[bj]=true;path.push(bj)}
  if(n<=120){let imp=true,it=0;
    while(imp&&it++<60){imp=false;
      for(let i=1;i<n-1;i++)for(let j=i+1;j<n;j++){
        const a=path[i-1],b=path[i],c=path[j],d=j+1<n?path[j+1]:-1;
        const before=D[a][b]+(d>=0?D[c][d]:0),after=D[a][c]+(d>=0?D[b][d]:0);
        if(after<before-1e-9){let x=i,y=j;while(x<y){const tmp=path[x];path[x]=path[y];path[y]=tmp;x++;y--}imp=true}}}}
  return path.map(i=>arr[i]);
}
/* ordina per giorno e ottimizza il percorso dentro ogni giorno */
function organize(){
  const t=trip(),groups=new Map();
  t.places.forEach(p=>{const k=p.date||"";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});
  const keys=[...groups.keys()].sort((a,b)=>a===""?1:b===""?-1:a.localeCompare(b));
  const out=[];keys.forEach(k=>out.push(...orderPath(groups.get(k))));
  t.places=out;
}
$("#lOpt").onclick=()=>{
  const t=trip();if(t.places.length<3){toast("Servono almeno 3 luoghi per ottimizzare");return}
  const sn=snapshot(),before=totalKm(t.places);organize();const after=totalKm(t.places);
  save();renderAll();
  const diff=before-after;
  toast(diff>1?"Percorso più corto: "+Math.round(before)+" → "+Math.round(after)+" km":"Il percorso era già efficiente","Annulla",undoTo(sn,t.id));
};
/* divide una sequenza in N giorni minimizzando i km interni a ogni giorno */
function splitChunks(path,N){
  const n=path.length,e=[0];for(let i=1;i<n;i++)e.push(e[i-1]+dist(path[i-1],path[i]));
  const lo=Math.max(1,Math.floor(n/N)-1),hi=Math.ceil(n/N)+1,INF=1e18;
  const dp=Array.from({length:N+1},()=>Array(n+1).fill(INF)),pr=Array.from({length:N+1},()=>Array(n+1).fill(0));dp[0][0]=0;
  for(let j=1;j<=N;j++)for(let i=1;i<=n;i++)for(let s=lo;s<=hi&&s<=i;s++){const a=i-s;if(dp[j-1][a]>=INF)continue;const c=dp[j-1][a]+(e[i-1]-e[a]);if(c<dp[j][i]){dp[j][i]=c;pr[j][i]=a}}
  if(dp[N][n]>=INF){const sizes=[];let left=n;for(let j=N;j>0;j--){const s=Math.ceil(left/j);sizes.unshift(s);left-=s}return sizes}
  const sizes=[];let i=n;for(let j=N;j>0;j--){const a=pr[j][i];sizes.unshift(i-a);i=a}return sizes;
}
function planDays(){
  const t=trip();
  if(!t.start){toast("Imposta prima le date del viaggio");openTrip(t);return}
  const und=t.places.filter(p=>!p.date&&!p.done);
  if(!und.length){toast("Tutti i luoghi hanno già una data");return}
  const dl=tripDays(t),cnt=d=>t.places.filter(p=>p.date===d).length;
  let free=dl.filter(d=>cnt(d)<3);if(!free.length)free=dl;
  const sn=snapshot(),ord=orderPath(und),M=free.length;
  if(ord.length<=M){ord.forEach((p,i)=>{p.date=free[Math.floor(i*M/ord.length)]})}
  else{const sizes=splitChunks(ord,M);let k=0;sizes.forEach((s,di)=>{for(let x=0;x<s;x++)ord[k++].date=free[di]})}
  organize();save();renderAll();setCal(t.start);
  toast(ord.length+" luoghi distribuiti su "+Math.min(M,ord.length)+" giorni","Annulla",undoTo(sn,t.id));
}

/* ================= controlli automatici ================= */
function insights(){
  const t=trip(),pl=t.places,out=[];
  if(!pl.length)return[{sev:"info",text:"Aggiungi qualche luogo e qui compariranno controlli e consigli sul tuo itinerario."}];
  if(!t.start)out.push({sev:"info",text:"Il viaggio non ha date. Con le date puoi pianificare i giorni in automatico.",act:["Imposta date","editTrip"]});
  const und=pl.filter(p=>!p.date&&!p.done);
  if(t.start&&und.length)out.push({sev:"warn",text:und.length+" "+(und.length===1?"luogo non ha":"luoghi non hanno")+" ancora una data.",act:["Pianifica giorni","plan"]});
  const dl=tripDays(t);
  if(t.start){
    const out2=pl.filter(p=>p.date&&(p.date<t.start||p.date>(t.end||t.start)));
    if(out2.length)out.push({sev:"bad",text:out2.length+" "+(out2.length===1?"luogo ha":"luoghi hanno")+" una data fuori dal viaggio (es. "+out2[0].name+").",act:["Pianifica giorni","plan"]});
    dl.forEach(d=>{const dp=pl.filter(p=>p.date===d),km=totalKm(dp);
      if(dp.length>5)out.push({sev:"warn",text:fmtDate(d)+": "+dp.length+" luoghi in un giorno sono tanti. Valuta di spostarne qualcuno.",act:["Vedi giorno","day:"+d]});
      else if(km>250)out.push({sev:"warn",text:fmtDate(d)+": "+Math.round(km)+" km di spostamenti in un solo giorno.",act:["Vedi giorno","day:"+d]});
      if(dp.length>=3&&!dp.some(p=>p.cat==="cibo"))out.push({sev:"info",text:fmtDate(d)+": nessun posto dove mangiare in programma.",act:["Suggerisci","sug:mangiare"]})});
    const empty=dl.filter(d=>!pl.some(p=>p.date===d));
    if(dl.length<=31&&empty.length&&pl.some(p=>p.date))out.push({sev:"info",text:empty.length+" "+(empty.length===1?"giornata libera":"giornate libere")+" ("+empty.slice(0,3).map(fmtDate).join(", ")+(empty.length>3?"…":"")+").",act:["Suggerisci","sug:vedere"]});
    if(dl.length>1&&!pl.some(p=>p.cat==="alloggio"))out.push({sev:"info",text:"Il viaggio dura più giorni ma non hai aggiunto un alloggio.",act:["Cerca alloggi","sug:dormire"]});
  }
  if(pl.length>=4){
    const cx=pl.reduce((a,p)=>a+p.lat,0)/pl.length,cy=pl.reduce((a,p)=>a+p.lon,0)/pl.length;
    const ds=pl.map(p=>hav(p.lat,p.lon,cx,cy)).sort((a,b)=>a-b),med=ds[Math.floor(ds.length/2)];
    pl.forEach(p=>{const d=hav(p.lat,p.lon,cx,cy);if(d>150&&d>med*4)out.push({sev:"warn",text:p.name+" è lontano dagli altri luoghi ("+Math.round(d)+" km dal centro del viaggio).",act:["Mostra","go:"+p.id]})})}
  for(let i=0;i<pl.length;i++)for(let j=i+1;j<pl.length;j++)if(dist(pl[i],pl[j])<0.15&&norm(pl[i].name).slice(0,5)===norm(pl[j].name).slice(0,5)){out.push({sev:"warn",text:"«"+pl[i].name+"» e «"+pl[j].name+"» sembrano lo stesso posto.",act:["Mostra","go:"+pl[i].id]});i=pl.length;break}
  if(!out.length)out.push({sev:"ok",text:"Tutto in ordine: date, giorni e spostamenti sembrano ben bilanciati."});
  return out;
}

function nearbyTowns(a){
  const have=new Set(trip().places.map(p=>norm(p.name)));
  const mk=(minPop)=>BIG.filter(c=>c.pop>=minPop&&!have.has(norm(c.name))).map(c=>({c,d:hav(a.lat,a.lon,c.lat,c.lon)})).filter(x=>x.d>=12&&x.d<=140).sort((x,y)=>y.c.pop-x.c.pop);
  let r=mk(60000);if(r.length<4)r=mk(15000);
  return r.slice(0,6).map(x=>{const l=leg({lat:a.lat,lon:a.lon},x.c);return{name:x.c.name,sub:cname(x.c.cc),lat:x.c.lat,lon:x.c.lon,cat:"cultura",desc:fmtKm(x.d)+" da qui, "+l.t.replace("≈ ","")}})
}
async function runSuggest(kind){
  sug.kind=kind;const a=anchorPoint();

  if(kind==="gite"){

    sug.err="";sug.res=nearbyTowns(a);renderSugg();return}
  if(!sampleFn){sug.res=null;sug.err="I suggerimenti di Claude non sono disponibili in questa vista. Le gite in giornata funzionano comunque.";renderSugg();return}
  sug.busy=true;sug.err="";sug.res=null;renderSugg();

  const what={vedere:"attrazioni e luoghi da vedere, anche non banali",mangiare:"ristoranti, trattorie o locali tipici ben noti e apprezzati",dormire:"alloggi ben valutati, in posizione comoda per gli altri luoghi"}[kind];
  const prompt='Sei un esperto di viaggi. Viaggio: "'+t.name+'". Luoghi già nel piano: '+(names||"nessuno")+'.\n'+
    (a.sel?'Cerca vicino a "'+a.name+'" ('+a.lat.toFixed(4)+','+a.lon.toFixed(4)+'), entro circa 15 km.':'Cerca nella stessa zona dei luoghi del piano, vicino a ('+a.lat.toFixed(3)+','+a.lon.toFixed(3)+').')+

  sug.busy=false;renderSugg();

    packBusy=true;renderPack();
    const where=t.places.slice(0,8).map(p=>p.name+(p.sub?", "+p.sub:"")).join("; ")||t.name;
    try{let r=await sampleFn.json('Viaggio "'+t.name+'" con questi luoghi: '+where+'. Date: '+(t.start?t.start+" – "+(t.end||t.start):"non definite")+'. Rispondi SOLO con un array JSON di al massimo 10 stringhe brevi (in italiano) con cose da portare o da fare prima di partire, specifiche per questa destinazione e stagione (documenti o visti, clima, prese elettriche, prenotazioni da fare in anticipo, app utili).');
      if(r&&!Array.isArray(r))r=Object.values(r).find(Array.isArray)||[];
      const have=new Set(t.pack.map(x=>norm(x.t)));(r||[]).slice(0,10).forEach(s=>{s=String(s).trim();if(s&&!have.has(norm(s)))t.pack.push({id:uid(),t:s,d:false})});save()
    }catch(err){toast("Consigli non disponibili ora")}
    packBusy=false;renderPack();
  }
});
$("#pack").addEventListener("submit",e=>{e.preventDefault();const i=$("#pkIn"),v=i.value.trim();if(!v)return;trip().pack.push({id:uid(),t:v,d:false});save();renderPack();$("#pkIn").focus()});

/* ================= finestra luogo ================= */
function openPlace(p,mode){
  const edit=mode==="edit";
  modal('<h3>'+(edit?"Modifica luogo":"Aggiungi al viaggio")+'</h3>'+
    '<label>Nome<input id="pn" value="'+esc(p.name||"")+'" placeholder="Nome del luogo" maxlength="80"></label>'+
    '<label>Dettaglio<input id="ps" value="'+esc(p.sub||"")+'" placeholder="Città, indirizzo…" maxlength="100"></label>'+
    '<div class="two"><label>Categoria<select id="pc">'+Object.entries(CATS).map(([k,v])=>'<option value="'+k+'"'+(k===(p.cat||"altro")?" selected":"")+'>'+v.n+'</option>').join("")+'</select></label>'+
    '<label>Data<input id="pd" type="date" value="'+esc(p.date||(!edit&&flt.day&&flt.day!=="none"?flt.day:"")||"")+'"></label></div>'+
    '<label>Note<textarea id="pt" rows="2" placeholder="Facoltative">'+esc(p.note||"")+'</textarea></label>'+
    '<div class="coords">'+(+p.lat).toFixed(4)+', '+(+p.lon).toFixed(4)+(p.desc?' · '+esc(p.desc):"")+'</div>'+
    '<div class="mfoot"><button class="btn" id="px" type="button">Annulla</button><button class="btn primary" id="pok" type="button">'+(edit?"Salva":"Aggiungi")+'</button></div>');
  $("#px").onclick=closeLayer;
  const ok=()=>{
    const name=$("#pn").value.trim();if(!name){$("#pn").focus();return}
    const data={name,sub:$("#ps").value.trim(),cat:$("#pc").value,date:$("#pd").value,note:$("#pt").value.trim(),cost:0};
    let np=null;
    if(edit){Object.assign(p,data)}
    else{np={id:uid(),lat:+p.lat,lon:+p.lon,done:false,fav:false,...data};trip().places.push(np);selId=np.id}
    save();ghost=null;$("#layer").innerHTML="";renderAll();
    if(np){flyPlace(np,Math.min(Math.max(view.w,0.3),3));toast("Aggiunto: "+np.name)}
  };
  $("#pok").onclick=ok;$("#pn").addEventListener("keydown",e=>{if(e.key==="Enter")ok()});
  if(!edit)setTimeout(()=>{$("#pn").focus()},0);
}
function addExample(){
  const t=trip(),sn=snapshot();
  if(!t.start){t.start=addDays(todayIso(),14);t.end=addDays(todayIso(),16)}
  if(t.name==="Il mio primo viaggio")t.name="Weekend a Roma";
  [["Colosseo","Piazza del Colosseo",41.8902,12.4922,"cultura",18],["Fontana di Trevi","Rione Trevi",41.9009,12.4833,"cultura",0],["Pantheon","Piazza della Rotonda",41.8986,12.4769,"cultura",5],["Trattoria a Trastevere","Trastevere",41.8867,12.4699,"cibo",35],["Musei Vaticani","Città del Vaticano",41.9065,12.4536,"cultura",20],["Villa Borghese","Parco urbano",41.9142,12.4923,"natura",0],["Hotel in centro","Via del Corso",41.9032,12.4796,"alloggio",120]]
   .forEach(r=>t.places.push({id:uid(),name:r[0],sub:r[1],lat:r[2],lon:r[3],cat:r[4],date:"",note:"",done:false,fav:false,cost:r[5]}));
  save();renderAll();fit();setCal(t.start);toast("Esempio caricato. Prova «Pianifica giorni» e «Ottimizza percorso»","Annulla",undoTo(sn,t.id));
}

/* ================= ricerca ================= */
const q=$("#q"),drop=$("#drop");
let items=[],actIdx=-1,aiState={q:"",res:null,busy:false,err:""};
function pickItem(it){
  if(!it)return;
  if(it.type==="link"){window.open(it.href,"_blank","noopener");return}
  if(it.type==="ask"){askClaude();return}
  if(it.type==="saved"){selectPlace(it.id,true);const p=findP(it.id);flyPlace(p,Math.min(view.w,0.4));closeDrop();return}
  ghost={lat:it.lat,lon:it.lon,name:it.name};flyTo(...P(it.lat,it.lon),it.type==="ai"?0.3:0.8);renderPins();closeDrop();
  openPlace({lat:it.lat,lon:it.lon,name:it.name,sub:it.sub||"",cat:it.cat||"altro",desc:it.desc||"",cost:it.cost||0},"add");
}
function closeDrop(){drop.hidden=true;actIdx=-1}
function renderDrop(){
  const v=q.value.trim();if(!v){closeDrop();return}
  const k=norm(v);items=[];let h="";
  const saved=trip().places.filter(p=>norm(p.name+" "+(p.sub||"")+" "+(p.note||"")).includes(k)).slice(0,4);
  const cur=CITIES.filter(c=>c.k.includes(k)).sort((a,b)=>(norm(a.name).startsWith(k)?0:1)-(norm(b.name).startsWith(k)?0:1)).slice(0,5);
  const curNames=new Set(cur.map(c=>norm(c.name)));
  let big=[];if(BIG.length&&k.length>=2){const pre=[],inc=[];for(const c of BIG){if(curNames.has(c.k))continue;if(c.k.startsWith(k)){pre.push(c);if(pre.length>=6)break}else if(inc.length<6&&c.k.includes(k))inc.push(c)}big=pre.concat(inc).slice(0,6)}
  const sec=t=>{h+='<h4>'+t+'</h4>'};
  const add=(it,main,sub,go)=>{const i=items.push(it)-1;h+='<button type="button" class="ritem" data-i="'+i+'"><span class="t"><b>'+esc(main)+'</b><span>'+esc(sub)+'</span></span><span class="go">'+go+'</span></button>'};
  if(saved.length){sec("Nel viaggio");saved.forEach(p=>add({type:"saved",id:p.id},p.name,p.sub||CATS[p.cat].n,"Mostra"))}
  if(cur.length){sec("Destinazioni");cur.forEach(c=>add({type:"city",...c},c.name,c.sub,"Aggiungi"))}
  if(big.length){sec("Città nel mondo");big.forEach(c=>add({type:"city",name:c.name,sub:cname(c.cc),lat:c.lat,lon:c.lon},c.name,cname(c.cc)+" · "+(c.pop>=1e6?(c.pop/1e6).toFixed(1).replace(".",",")+" mln":Math.round(c.pop/1000)+" mila")+" ab.","Aggiungi"))}
  if(aiState.q===v&&aiState.res&&aiState.res.length){sec("Risultati");aiState.res.forEach(r=>add({type:"ai",...r},r.name,(r.sub||"")+(r.desc?" · "+r.desc:""),"Aggiungi"))}
  sec("Cerca ovunque");
  if(aiState.busy)h+='<div class="empty"><span class="spin">'+ic("load")+'</span> Cerco…</div>';
  else if(aiState.err&&aiState.q===v)h+='<div class="empty">'+esc(aiState.err)+'</div>';
  if(sampleFn)add({type:"ask"},"Cerca luogo: «"+v+"»","Luoghi reali, ristoranti, hotel, monumenti con coordinate","Cerca");
  add({type:"link",href:gmapsQ(v)},"Google Maps: «"+v+"»","Si apre in una nuova scheda","Apri");
  add({type:"link",href:tripadv(v)},"Tripadvisor: «"+v+"»","Hotel, ristoranti, attrazioni","Apri");
  drop.innerHTML=h;drop.hidden=false;
  const sel=actIdx>=0?drop.querySelector('[data-i="'+actIdx+'"]'):null;if(sel)sel.classList.add("act");
}
q.addEventListener("input",()=>{actIdx=-1;if(aiState.q!==q.value.trim()){aiState.res=null;aiState.err=""}renderDrop()});
q.addEventListener("focus",renderDrop);
q.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!items.length)return;actIdx=(actIdx+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;renderDrop();const a=drop.querySelector(".act");if(a)a.scrollIntoView({block:"nearest"})}
  else if(e.key==="Enter"){e.preventDefault();if(actIdx>=0)pickItem(items[actIdx]);else{const first=items.find(i=>i.type==="saved"||i.type==="city"||i.type==="ai");if(first)pickItem(first);else if(sampleFn)askClaude();else if(items.length)pickItem(items.find(i=>i.type==="link"))}}
  else if(e.key==="Escape"){closeDrop();q.blur()}
});
drop.addEventListener("click",e=>{const b=e.target.closest(".ritem");if(b)pickItem(items[+b.dataset.i])});
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#sbox"))closeDrop()});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$("#veil")){e.preventDefault();q.focus()}if(e.key==="Escape"&&$("#veil"))closeLayer()});
async function askClaude(){
  const v=q.value.trim();if(!v||aiState.busy||!sampleFn)return;
  aiState={q:v,res:null,busy:true,err:""};renderDrop();
  const prompt='Sei il motore di ricerca luoghi di un planner di viaggi. Ricerca dell\'utente: "'+v.replace(/"/g,"'")+'".\n'+
   'Rispondi SOLO con un array JSON di al massimo 5 luoghi reali che corrispondono (città, monumenti, ristoranti noti, spiagge, hotel, parchi, ecc.). Ogni elemento: {"name":string,"sub":string (città e paese),"lat":number,"lon":number,"cat":"cultura|cibo|natura|alloggio|trasporti|altro","desc":string (max 8 parole, in italiano),"cost":number (spesa media a persona in euro, 0 se gratis o ignota)}. '+
   'Usa coordinate decimali precise. Se la ricerca è generica (es. "spiagge in Sardegna") restituisci i migliori luoghi. Nessun testo fuori dal JSON.';
  try{const r=await askList(prompt);aiState={q:v,res:r.slice(0,5),busy:false,err:r.length?"":"Nessun risultato. Prova con altre parole."}}
  catch(e){aiState={q:v,res:null,busy:false,err:e&&e.code==="not_granted"?"Ricerca con Claude non autorizzata.":"Ricerca non riuscita. Riprova tra poco."}}
  if(q.value.trim()===v)renderDrop();
}
async function initSample(){try{if(!window.claude||!claude.use)return;const s=await claude.use("sample");if(s){sampleFn=s;if(q.value)renderDrop();renderSugg();renderPack()}}catch(e){}}

/* ================= avvio ================= */
function renderAll(){renderTrips();renderCal();renderProg();renderList();renderPins();renderInsights();renderSugg();typeof renderBook==="function"&&(renderBook(),renderSpese());renderPack()}
paintIcons();
applyTheme();
{const t=trip();if(t.start)setCal(t.start)}
renderAll();applyView();fit(true);
loadData();initCloud();initSample();
</script>
